    <meta name="description" content="Official web portfolio of Jennifer Gwen Tanadi, a Computer Science student at BINUS University specializing in Data Analytics, AI Research, and full-stack development." />
    <title>Jennifer Gwen Tanadi | Portfolio</title>
    <script>
      // Apply the saved theme before first paint so the page never flashes the wrong colors.
      (function () {
        var theme = 'dark';
        try {
          var saved = localStorage.getItem('theme');
          if (saved === 'light' || saved === 'dark') theme = saved;
          else if (window.matchMedia('(prefers-color-scheme: light)').matches) theme = 'light';
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
